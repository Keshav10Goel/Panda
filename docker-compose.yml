services:
  postgres:
    image: postgres:17
    container_name: panda-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: panda
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda_dev_password

    ports:
      - "5432:5432"

    volumes:
      - panda_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  panda_postgres_data: